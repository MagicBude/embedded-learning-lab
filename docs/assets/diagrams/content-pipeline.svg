<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 360" role="img" aria-labelledby="title desc">
<title id="title">候选内容构建流水线</title><desc id="desc">人工内容和课程产物分别校验后汇入统一索引，再依次完成站点构建、预览验收和部署。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7890aa"/></marker><style>.bg{fill:#fff}.n{fill:#e4f2ff;stroke:#b9d6ee;stroke-width:1.5}.c{fill:#d8ecff;stroke:#75b4e2;stroke-width:2}.e{fill:none;stroke:#7890aa;stroke-width:1.8;marker-end:url(#a)}.t{font:600 16px system-ui,"Microsoft YaHei",sans-serif;fill:#075b9c;text-anchor:middle;dominant-baseline:middle}.s{font:500 13px system-ui,"Microsoft YaHei",sans-serif;fill:#334e68;text-anchor:middle;dominant-baseline:middle}@media(prefers-color-scheme:dark){.bg{fill:#111827}.n{fill:#153b5c;stroke:#39749e}.c{fill:#17476c;stroke:#59a1d1}.t{fill:#a8d8ff}.s{fill:#e2e8f0}.e{stroke:#91a4ba}}</style></defs>
<rect class="bg" width="1320" height="360"/>
<g><rect class="n" x="25" y="55" width="190" height="70" rx="18"/><text class="t" x="120" y="90">人工维护的内容源</text><rect class="n" x="25" y="235" width="190" height="70" rx="18"/><text class="t" x="120" y="262">课程源或外部</text><text class="s" x="120" y="286">生成产物</text><rect class="n" x="280" y="55" width="210" height="70" rx="18"/><text class="t" x="385" y="82">元数据、引用</text><text class="s" x="385" y="106">与链接校验</text><rect class="n" x="280" y="235" width="210" height="70" rx="18"/><text class="t" x="385" y="262">课程清单</text><text class="s" x="385" y="286">与产物校验</text><rect class="c" x="555" y="145" width="180" height="70" rx="18"/><text class="t" x="645" y="180">统一内容索引</text><rect class="n" x="800" y="145" width="150" height="70" rx="18"/><text class="t" x="875" y="180">站点构建</text><rect class="n" x="1015" y="145" width="150" height="70" rx="18"/><text class="t" x="1090" y="180">预览与验收</text><rect class="n" x="1230" y="145" width="70" height="70" rx="18"/><text class="t" x="1265" y="180">部署</text></g>
<path class="e" d="M215 90H280"/><path class="e" d="M215 270H280"/><path class="e" d="M490 90H520V180H555"/><path class="e" d="M490 270H520V180H555"/><path class="e" d="M735 180H800"/><path class="e" d="M950 180H1015"/><path class="e" d="M1165 180H1230"/>
</svg>
