<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
<title id="title">内容成熟生命周期</title><desc id="desc">内容从记录进入草稿和审核，验证后保持已验证状态；审核发现缺口退回草稿，已验证内容需要更新时返回审核，不再适用时归档。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7890aa"/></marker><style>.bg{fill:#fff}.n{fill:#e4f2ff;stroke:#b9d6ee;stroke-width:1.5}.c{fill:#d8ecff;stroke:#75b4e2;stroke-width:2}.e{fill:none;stroke:#7890aa;stroke-width:1.8;marker-end:url(#a)}.f{fill:none;stroke:#7890aa;stroke-width:1.7;stroke-dasharray:7 6;marker-end:url(#a)}.t{font:600 16px system-ui,"Microsoft YaHei",sans-serif;fill:#075b9c;text-anchor:middle;dominant-baseline:middle}.s{font:500 13px system-ui,"Microsoft YaHei",sans-serif;fill:#334e68;text-anchor:middle;dominant-baseline:middle}.note{font:500 13px system-ui,"Microsoft YaHei",sans-serif;fill:#627d98;text-anchor:middle}@media(prefers-color-scheme:dark){.bg{fill:#111827}.n{fill:#153b5c;stroke:#39749e}.c{fill:#17476c;stroke:#59a1d1}.t{fill:#a8d8ff}.s{fill:#e2e8f0}.note{fill:#a8b5c7}.e,.f{stroke:#91a4ba}}</style></defs>
<rect class="bg" width="1120" height="400"/><circle cx="35" cy="160" r="10" fill="#7890aa"/>
<g><rect class="n" x="80" y="123" width="155" height="74" rx="18"/><text class="t" x="157.5" y="151">Capture</text><text class="s" x="157.5" y="176">记录资料、问题或想法</text><rect class="n" x="285" y="123" width="155" height="74" rx="18"/><text class="t" x="362.5" y="151">Draft</text><text class="s" x="362.5" y="176">开始整理</text><rect class="n" x="490" y="123" width="155" height="74" rx="18"/><text class="t" x="567.5" y="151">Review</text><text class="s" x="567.5" y="176">结构完整，等待核对</text><rect class="c" x="695" y="123" width="155" height="74" rx="18"/><text class="t" x="772.5" y="151">Verified</text><text class="s" x="772.5" y="176">关键结论已验证</text><rect class="n" x="930" y="270" width="145" height="66" rx="18"/><text class="t" x="1002.5" y="303">Archived</text></g>
<path class="e" d="M45 160H80"/><path class="e" d="M235 160H285"/><path class="e" d="M440 160H490"/><path class="e" d="M645 160H695"/><path class="e" d="M850 160H885V303H930"/>
<path class="f" d="M567.5 197V245H362.5V197"/><text class="note" x="465" y="238">发现缺口</text><path class="f" d="M772.5 123V70H567.5V123"/><text class="note" x="670" y="62">来源、技术或表达需要更新</text>
</svg>
