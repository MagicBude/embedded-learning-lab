<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 920" role="img" aria-labelledby="title desc">
<title id="title">Embedded Learning Lab 长期学习路线</title>
<desc id="desc">路线从准备与工具、嵌入式 C、硬件与 MCU、外设与通信、小型系统闭环组成共同主干，随后分为 MCU 与 RTOS、Embedded Linux 应用、BSP 与 Linux 驱动、网络与 IoT 四条泳道；工程测试调试和系统设计可靠性贯穿全程。所有学习节点当前均为规划状态。</desc>
